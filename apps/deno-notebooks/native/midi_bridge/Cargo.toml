[package]
name = "midi_bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
crossbeam-channel = "0.5"
midir = "0.10.3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
midir = { version = "0.10.3", features = ["coremidi_send_timestamped"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
