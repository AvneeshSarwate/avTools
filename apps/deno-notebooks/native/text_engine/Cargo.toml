[package]
name = "text_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmic-text = { version = "0.17.1", features = ["swash", "std", "fontconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = { version = "0.2.6", features = ["render", "scale", "std"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
